  text: 旅程が決まったあと、実際に乗り継げる便の組み合わせを区間ごとの一覧の「上に」出す（一覧は消さない）。片道ぶんずつ組む（往復をひとつなぎにすると目的地の滞在が途中降機と判定される）。24時間以上とまる街は 8flyer で選んだ街に固定し、それ以外で24時間を超える組と、選んだ街が24時間に届かない組は落とす。日ずらしは前後2日まで。性格の違う3案（最短／乗り継ぎに余裕／寄り道に長くいられる）を出す
